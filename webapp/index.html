<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1B120E">
<title>Dunyo Hotel 1</title>
<meta name="description" content="Dunyo Hotel 1 — xonalar, narxlar va bron so‘rovi. Toshkent.">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<!-- Direction contract: DESIGN.md, "Direction Contract". Judge edits against it. -->

<svg aria-hidden="true" focusable="false" class="sprite" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="i-close" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
      <path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/>
    </g>
    <g id="i-cal" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="5.5" width="17" height="15" rx="1.5"/>
      <path d="M3.5 10.5h17M8 3.5v4M16 3.5v4"/>
    </g>
    <g id="i-guest" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="3.5"/>
      <path d="M4.5 20.5c1.6-3.7 4.3-5.5 7.5-5.5s5.9 1.8 7.5 5.5"/>
    </g>
    <g id="i-phone" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.2 3.5H5.6c-1 0-1.9.8-1.8 1.9.7 8.2 6.6 14.1 14.8 14.8 1.1.1 1.9-.8 1.9-1.8v-2.6c0-.9-.6-1.6-1.5-1.8l-2.4-.5c-.7-.1-1.4.2-1.8.8l-.8 1.3c-2.4-1.2-4.4-3.2-5.6-5.6l1.3-.8c.6-.4.9-1.1.8-1.8L9.9 5c-.1-.9-.9-1.5-1.7-1.5Z"/>
    </g>
    <g id="i-pin" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 21c4-4.4 6-7.8 6-10.4A6 6 0 0 0 6 10.6C6 13.2 8 16.6 12 21Z"/>
      <circle cx="12" cy="10.5" r="2.25"/>
    </g>
    <g id="i-key" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="8" r="4"/>
      <path d="m11 11 8.5 8.5M16 16l2-2M18.5 18.5l1.5-1.5"/>
    </g>
    <g id="i-check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 12.5 4.5 4.5L19 7"/>
    </g>
    <g id="i-minus" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M6 12h12"/>
    </g>
    <g id="i-plus" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 6v12M6 12h12"/>
    </g>
  </defs>
</svg>

<header class="rail">
  <h1 class="rail__name">Dunyo Hotel 1</h1>
  <button class="langsw" id="langsw" type="button" aria-label="Til / Язык">
    <span class="langsw__slot" data-lang="uz">UZ</span>
    <span class="langsw__slot" data-lang="ru">RU</span>
    <span class="langsw__knob" aria-hidden="true"></span>
  </button>
</header>

<main class="board" id="board">
  <p class="board__note" id="boardNote">Kalitni tanlang</p>
  <div class="holes" id="holes"></div>

  <section class="plaque">
    <h2 class="plaque__label" id="addrLabel">Manzil</h2>
    <button class="plaque__addr" id="addrText" type="button"></button>
    <button class="plaque__map" id="mapBtn" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-pin"/></svg>
      <span id="mapBtnText">Xaritada ko‘rsatish</span>
    </button>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>

<!-- Room sheet: slides over the board, which stays visible behind it. -->
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" hidden>
  <button class="sheet__close" id="sheetClose" type="button" aria-label="Yopish">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg>
  </button>

  <div class="sheet__scroll">
    <header class="sheet__head">
      <div class="tag tag--docked" id="dockTag"></div>
      <div class="sheet__id">
        <h2 class="sheet__title" id="sheetTitle"></h2>
        <p class="sheet__price" id="sheetPrice"></p>
      </div>
    </header>

    <div class="plate">
      <div class="plate__strip" id="gallery"></div>
      <div class="plate__rivets" id="rivets"></div>
    </div>

    <p class="sheet__note" id="sheetNote" hidden></p>
  </div>

  <div class="sheet__foot">
    <button class="brass-btn" id="bookBtn" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-key"/></svg>
      <span id="bookBtnText">Kalitni band qilish</span>
    </button>
  </div>
</section>

<!-- Guest card -->
<section class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle" tabindex="-1" hidden>
  <button class="card__close" id="cardClose" type="button" aria-label="Yopish">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg>
  </button>

  <form class="card__scroll" id="form" novalidate>
    <h2 class="card__title" id="cardTitle">Mehmon kartasi</h2>
    <p class="card__lead" id="cardLead"></p>

    <label class="field">
      <span class="field__label" id="lRoom">Xona</span>
      <select class="field__in field__in--sel" id="fRoom"></select>
    </label>

    <div class="field-row">
      <label class="field">
        <span class="field__label" id="lIn">Kelish</span>
        <span class="field__stamp">
          <svg class="ico ico--stamp" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-cal"/></svg>
          <input class="field__in" type="date" id="fIn">
        </span>
      </label>
      <label class="field">
        <span class="field__label" id="lOut">Ketish</span>
        <span class="field__stamp">
          <svg class="ico ico--stamp" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-cal"/></svg>
          <input class="field__in" type="date" id="fOut">
        </span>
      </label>
    </div>
    <p class="err" role="alert" id="errDate" hidden></p>

    <div class="field field--stamped">
      <!-- The arrival date, struck into the card the way a front desk strikes
           it: overprinted on the quiet half of the guests row, never over a
           control. -->
      <svg class="stamp" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <filter id="inkbleed" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="19" result="grain"/>
            <feDisplacementMap in="SourceGraphic" in2="grain" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <path id="stampArc" d="M60 60 m-39 0 a39 39 0 0 1 78 0" fill="none"/>
        </defs>
        <g filter="url(#inkbleed)" fill="currentColor">
          <circle cx="60" cy="60" r="53" fill="none" stroke="currentColor" stroke-width="3.4"/>
          <circle cx="60" cy="60" r="46" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <path d="M14 60h11M95 60h11" stroke="currentColor" stroke-width="1.3"/>
          <text class="stamp__arc"><textPath href="#stampArc" startOffset="50%" text-anchor="middle">DUNYO HOTEL</textPath></text>
          <text class="stamp__lab" x="60" y="52" text-anchor="middle" id="stampLabel">KELISH</text>
          <text class="stamp__date" x="60" y="72" text-anchor="middle" id="stampDate">—</text>
          <text class="stamp__lab" x="60" y="92" text-anchor="middle">SERGELI</text>
        </g>
      </svg>
      <span class="field__label" id="lGuests">Mehmonlar</span>
      <div class="stepper">
        <button class="stepper__btn" type="button" id="gMinus">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-minus"/></svg>
        </button>
        <span class="stepper__val" id="gVal" aria-live="polite">2</span>
        <button class="stepper__btn" type="button" id="gPlus">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg>
        </button>
      </div>
    </div>

    <label class="field">
      <span class="field__label" id="lName">Ism-familiya</span>
      <span class="field__stamp">
        <svg class="ico ico--stamp" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-guest"/></svg>
        <input class="field__in" type="text" id="fName" autocomplete="name" enterkeyhint="next">
      </span>
    </label>
    <p class="err" role="alert" id="errName" hidden></p>

    <label class="field">
      <span class="field__label" id="lPhone">Telefon</span>
      <span class="field__stamp">
        <svg class="ico ico--stamp" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-phone"/></svg>
        <input class="field__in" type="tel" id="fPhone" inputmode="tel" autocomplete="tel" value="+998 ">
      </span>
    </label>
    <p class="err" role="alert" id="errPhone" hidden></p>

    <div class="tally" id="tally">
      <div class="tally__row">
        <span class="tally__k" id="lNights">kecha</span>
        <span class="digits" id="dNights"></span>
      </div>
      <div class="tally__row tally__row--sum">
        <span class="tally__k" id="lTotal">Taxminiy jami</span>
        <span class="digits digits--sum" id="dTotal"></span>
      </div>
      <p class="tally__note" id="totalNote"></p>
    </div>

    <div class="stub">
      <div class="stub__perf" aria-hidden="true"></div>
      <h3 class="stub__title" id="stubTitle">Yuboriladigan xabar</h3>
      <pre class="stub__body" id="stubBody"></pre>
    </div>

    <p class="notice" id="notice" hidden></p>

    <button class="brass-btn brass-btn--wide" id="sendBtn" type="submit">
      <span id="sendBtnText">SO‘ROVNI YUBORISH</span>
    </button>
  </form>
</section>

<div class="done" id="done" hidden>
  <div class="done__mark">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg>
  </div>
  <p class="done__text" id="doneText"></p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
